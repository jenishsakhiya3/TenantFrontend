<div style="padding: 20px; font-family: Arial, sans-serif;">
  <h1>Posts List</h1>

  <div *ngIf="posts.length === 0">
    <p>Loading...</p>
  </div>

  <div *ngFor="let post of posts" style="border-bottom: 1px solid #ddd; padding: 10px 0;">
    <h3>{{ post.title }}</h3>
    <p>{{ post.body }}</p>
  </div>
</div>

# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy Node.js app to Azure Web App - FE1

on:
  push:
    branches:
      - front-end-1
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js version
        uses: actions/setup-node@v3
        with:
          node-version: '22.x'

      - name: npm install, build, and test
        run: |
          npm install
          npm run build --if-present
          npm run test --if-present

      - name: Upload artifact for deployment job
        uses: actions/upload-artifact@v4
        with:
          name: node-app
          path: .

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: node-app
      
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_68E8BD660AE24E04A5F5B83F23ABEEAC }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_5551615AF975457594F095A0880635D7 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_80A383C3CFDC49B3A4E062EC7309F622 }}

      - name: Generate env.js from App Service settings
        run: |
          BACKEND_URL=$(az webapp config appsettings list --name FE1 --resource-group RGJenishSakhiya --query "[?name=='BACKEND_URL'].value" -o tsv)
          echo "(function(window){window.__env=window.__env||{};window.__env.backendUrl='${BACKEND_URL}';})(this);" > dist/tenant-frontend/browser/env.js
          echo "Backend URL set to: ${BACKEND_URL}"

      - name: 'Deploy to Azure Web App'
        uses: azure/webapps-deploy@v3
        id: deploy-to-webapp
        with:
          app-name: 'FE1'
          slot-name: 'Production'
          package: 'dist/tenant-frontend/browser'
